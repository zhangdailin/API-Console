name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          version="sha-${commit:0:12}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("$image:$version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
            [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid version tag'; exit 1; }
            tags+=("$image:$version")
            if [[ "$version" != *-* ]]; then
              tags+=("$image:latest")
            fi
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=("$image:main")
          fi
          {
            echo "go_version=$(awk '$1 == "go" {print $2}' go.mod)"
            echo "version=$version"
            echo "commit=$commit"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'tags<<TAGS'
            printf '%s\n' "${tags[@]}"
            echo TAGS
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: api-console:verify
          build-args: |
            GO_VERSION=${{ steps.meta.outputs.go_version }}
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
            org.opencontainers.image.created=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64

      - name: Verify image identity and startup
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.meta.outputs.commit }}
        shell: bash
        run: |
          docker run --rm api-console:verify --version > "$RUNNER_TEMP/version.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          info = json.loads((Path(os.environ['RUNNER_TEMP']) / 'version.json').read_text())
          assert info['version'] == os.environ['EXPECTED_VERSION'], info
          assert info['commit'] == os.environ['EXPECTED_COMMIT'], info
          assert (info['os'], info['arch'], info['build_type']) == ('linux', 'amd64', 'docker'), info
          config = {'redis_addr': 'api-console-redis:6379', 'admin_pass': 'ci-smoke-only',
                    'credential_encryption_key_file': '/app/data/credential.key'}
          (Path(os.environ['RUNNER_TEMP']) / 'docker-config.json').write_text(json.dumps(config))
          PY
          chmod 644 "$RUNNER_TEMP/docker-config.json"
          docker network create api-console-ci
          docker run -d --name api-console-redis --network api-console-ci redis:7-alpine
          for attempt in {1..30}; do
            if docker exec api-console-redis redis-cli ping | grep -qx PONG; then break; fi
            sleep 1
          done
          docker exec api-console-redis redis-cli ping | grep -qx PONG
          docker run -d --name api-console-smoke --network api-console-ci \
            -p 127.0.0.1:3002:3002 \
            -v "$RUNNER_TEMP/docker-config.json:/app/config.json:ro" \
            -v api-console-ci-data:/app/data api-console:verify
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-delay 1 --max-time 5 http://127.0.0.1:3002/health > "$RUNNER_TEMP/health.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          health = json.loads((Path(os.environ['RUNNER_TEMP']) / 'health.json').read_text())
          assert health['build']['commit'] == os.environ['EXPECTED_COMMIT'], health
          PY
          curl --fail --silent --show-error http://127.0.0.1:3002/admin/login.html > /dev/null
          docker exec api-console-smoke test -s /app/data/credential.key

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs api-console-smoke 2>&1 || true
          docker rm -f api-console-smoke api-console-redis || true
          docker volume rm api-console-ci-data || true
          docker network rm api-console-ci || true

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish exactly the image that passed the container checks above.
      - name: Publish verified image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag api-console:verify "$tag"
            docker push "$tag"
            echo "Published: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"
