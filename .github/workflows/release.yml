name: Release

# Builds the deployable Linux server from a tag, publishes it with a SHA-256
# checksum, and records the commit it came from. Deployments pin a version and
# verify the checksum, so "which code is running on us1" stops being a guess.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without publishing
        type: boolean
        default: true
      version:
        description: 'Version label for this build (e.g. v1.2.3-manual)'
        required: true
        default: 'v1.0.3'

permissions:
  contents: write

env:
  GOOS_TARGET: linux
  GOARCH_TARGET: amd64

jobs:
  build:
    name: Build linux/amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go (toolchain from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # The embedded web assets ship inside the binary, so the frontend tests are
      # part of "is this build releasable", not a separate concern.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run web asset tests
        run: |
          node --test web/*.test.cjs
          ./scripts/check-provider-registry.sh

      - name: Run Go tests
        run: go test ./... -count=1 -p 1

      - name: Resolve version and build metadata
        id: meta
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build server
        run: |
          CGO_ENABLED=0 GOOS="${GOOS_TARGET}" GOARCH="${GOARCH_TARGET}" \
            go build -trimpath -ldflags "-s -w -X orchids-api/internal/buildinfo.Version=${{ steps.meta.outputs.version }} -X orchids-api/internal/buildinfo.Commit=${{ steps.meta.outputs.commit }} -X orchids-api/internal/buildinfo.Date=${{ steps.meta.outputs.built_at }} -X orchids-api/internal/buildinfo.BuildType=release" -o "dist/orchids-server-${GOOS_TARGET}-${GOARCH_TARGET}" ./cmd/server

      - name: Verify compiled identity
        run: |
          dist/orchids-server-linux-amd64 --version > dist/version.json
          python3 -c 'import json; d=json.load(open("dist/version.json")); assert d["version"] == "${{ steps.meta.outputs.version }}"; assert d["commit"] == "${{ steps.meta.outputs.commit }}"; assert d["build_type"] == "release"'

      - name: Checksum and metadata
        run: |
          cd dist
          binary="orchids-server-${GOOS_TARGET}-${GOARCH_TARGET}"
          sha256sum "$binary" > "$binary.sha256"
          printf '%s\n' \
            'version=${{ steps.meta.outputs.version }}' \
            'commit=${{ steps.meta.outputs.commit }}' \
            'built_at=${{ steps.meta.outputs.built_at }}' \
            "goos=${GOOS_TARGET}" \
            "goarch=${GOARCH_TARGET}" \
            > "$binary.build-info.txt"
          ls -l

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: orchids-server-${{ steps.meta.outputs.version }}-linux-amd64
          path: dist/*
          if-no-files-found: error

      # Generate an explicit body so publishing the same tag replaces the notes
      # rather than appending another generated changelog to an existing release.
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" \
            --jq '.body' > "$RUNNER_TEMP/release-notes.md"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
          append_body: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
