{{define "egress-modals.html"}}
<div class="modal" id="egressNodeModal" role="dialog" aria-modal="true" aria-labelledby="egressNodeModalTitle">
  <div class="modal-content modal-content-md">
    <div class="modal-header">
      <h3 class="modal-title" id="egressNodeModalTitle">添加节点</h3>
      <button class="modal-close" type="button" data-egress-close="egressNodeModal" aria-label="关闭">&times;</button>
    </div>
    <form id="egressNodeForm" novalidate>
      <div class="modal-body egress-form">
        <label class="egress-switch-row"><span class="form-label">启用</span><span class="toggle"><input type="checkbox" id="egressNodeEnabled" checked aria-label="启用"><span class="toggle-slider"></span></span></label>
        <div class="egress-form-grid">
          <div><label class="form-label" for="egressNodeName">名称</label><input class="form-input" id="egressNodeName" maxlength="80" required></div>
          <div><label class="form-label" for="egressNodeScope">范围</label>
            <select class="form-input" id="egressNodeScope"><option value="grok_build">Build</option><option value="grok_web" selected>Web</option><option value="grok_web_asset">Web 资源</option></select></div>
          <div><label class="form-label" for="egressNodeCapacity">账号容量</label><input class="form-input" id="egressNodeCapacity" type="number" min="0" max="100000" step="1" placeholder="不限"></div>
        </div>
        <div id="egressNodeClearanceRow" class="egress-inline-note"></div>
        <div><label class="form-label" for="egressNodeProfile">代理配置</label>
          <select class="form-input" id="egressNodeProfile"><option value="">不使用（填写下方代理地址）</option></select></div>
        <div id="egressNodeProxyRow">
          <label class="form-label" for="egressNodeProxy">代理地址 <span class="secret-badge">密钥</span></label>
          <input class="form-input secret-field" id="egressNodeProxy" autocomplete="off" spellcheck="false" placeholder="socks5h://user:pass@host:port">
          <p class="form-hint" id="egressNodeProxyHint">支持 http、socks5、socks5h 与 trojan / vless / ss / vmess 分享链接（隧道在本机转发，FlareSolverr 无法使用）；留空为直连。</p>
          <label class="egress-check-inline"><input type="checkbox" id="egressNodeClearProxy"> 清除已保存的代理地址（改为直连）</label>
        </div>
        <label class="egress-switch-row"><span><span class="form-label">代理池</span><span class="form-hint">地址里的 {account} 按账号替换，用于轮换代理的会话粘滞；代理池节点不参与固定兜底。</span></span><span class="toggle"><input type="checkbox" id="egressNodePool" aria-label="代理池"><span class="toggle-slider"></span></span></label>
        <div id="egressNodeManualRows">
          <label class="form-label" for="egressNodeUA">User-Agent</label>
          <input class="form-input" id="egressNodeUA" maxlength="512" spellcheck="false">
          <p class="form-hint">Cookie 签发时浏览器使用的 UA，留空使用范围默认值。</p>
          <label class="form-label" for="egressNodeCookies">Cloudflare Cookie <span class="secret-badge">密钥</span></label>
          <input class="form-input secret-field" id="egressNodeCookies" autocomplete="off" spellcheck="false" placeholder="cf_clearance=...; __cf_bm=...">
          <p class="form-hint" id="egressNodeCookiesHint">须在同一出口 IP、同一 UA 的浏览器中获取。</p>
          <label class="egress-check-inline"><input type="checkbox" id="egressNodeClearCookies"> 清除已保存的 Cookie</label>
        </div>
        <p class="warning-text" id="egressNodeError" role="alert"></p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" data-egress-close="egressNodeModal">取消</button>
        <button type="submit" class="btn btn-primary" id="egressNodeSubmit">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="egressImportModal" role="dialog" aria-modal="true" aria-labelledby="egressImportModalTitle">
  <div class="modal-content modal-content-md">
    <div class="modal-header">
      <h3 class="modal-title" id="egressImportModalTitle">文本导入</h3>
      <button class="modal-close" type="button" data-egress-close="egressImportModal" aria-label="关闭">&times;</button>
    </div>
    <form id="egressImportForm" novalidate>
      <div class="modal-body egress-form">
        <div class="egress-form-grid">
          <div><label class="form-label" for="egressImportName">名称前缀</label><input class="form-input" id="egressImportName" maxlength="60" placeholder="import"></div>
          <div><label class="form-label" for="egressImportScope">范围</label>
            <select class="form-input" id="egressImportScope"><option value="grok_build">Build</option><option value="grok_web" selected>Web</option><option value="grok_web_asset">Web 资源</option></select></div>
          <div><label class="form-label" for="egressImportCapacity">账号容量</label><input class="form-input" id="egressImportCapacity" type="number" min="0" max="100000" step="1" placeholder="不限"></div>
        </div>
        <label class="form-label" for="egressImportContent">代理列表</label>
        <textarea class="form-input egress-mono" id="egressImportContent" rows="9" spellcheck="false" placeholder="每行一个：http://user:pass@host:port&#10;socks5h://host:1080&#10;trojan://… / vless://… / ss://… / vmess://…&#10;也可直接粘贴 Clash YAML 或 Base64 订阅内容"></textarea>
        <p class="form-hint" id="egressImportDetected">尚未识别到地址</p>
        <p class="warning-text" id="egressImportError" role="alert"></p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" data-egress-close="egressImportModal">取消</button>
        <button type="submit" class="btn btn-primary" id="egressImportSubmit">导入</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="egressProfileModal" role="dialog" aria-modal="true" aria-labelledby="egressProfileModalTitle">
  <div class="modal-content modal-content-sm">
    <div class="modal-header">
      <h3 class="modal-title" id="egressProfileModalTitle">代理配置</h3>
      <button class="modal-close" type="button" data-egress-close="egressProfileModal" aria-label="关闭">&times;</button>
    </div>
    <form id="egressProfileForm" novalidate>
      <div class="modal-body egress-form">
        <label class="form-label" for="egressProfileName">名称</label>
        <input class="form-input" id="egressProfileName" maxlength="80" required>
        <label class="form-label" for="egressProfileProxy">代理地址 <span class="secret-badge">密钥</span></label>
        <input class="form-input secret-field" id="egressProfileProxy" autocomplete="off" spellcheck="false" placeholder="socks5h://user:pass@host:port">
        <p class="form-hint" id="egressProfileHint">编辑时留空表示保留原地址。</p>
        <p class="warning-text" id="egressProfileError" role="alert"></p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" data-egress-close="egressProfileModal">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="egressSourceModal" role="dialog" aria-modal="true" aria-labelledby="egressSourceModalTitle">
  <div class="modal-content modal-content-md">
    <div class="modal-header">
      <h3 class="modal-title" id="egressSourceModalTitle">订阅</h3>
      <button class="modal-close" type="button" data-egress-close="egressSourceModal" aria-label="关闭">&times;</button>
    </div>
    <form id="egressSourceForm" novalidate>
      <div class="modal-body egress-form">
        <label class="egress-switch-row"><span class="form-label">启用</span><span class="toggle"><input type="checkbox" id="egressSourceEnabled" checked aria-label="启用"><span class="toggle-slider"></span></span></label>
        <div class="egress-form-grid">
          <div><label class="form-label" for="egressSourceName">名称</label><input class="form-input" id="egressSourceName" maxlength="80" required></div>
          <div><label class="form-label" for="egressSourceScope">范围</label>
            <select class="form-input" id="egressSourceScope"><option value="grok_build">Build</option><option value="grok_web" selected>Web</option><option value="grok_web_asset">Web 资源</option></select></div>
        </div>
        <label class="form-label" for="egressSourceURL">订阅地址 <span class="secret-badge">密钥</span></label>
        <input class="form-input secret-field" id="egressSourceURL" autocomplete="off" spellcheck="false" placeholder="https://…">
        <p class="form-hint" id="egressSourceURLHint"></p>
        <label class="egress-switch-row"><span><span class="form-label">经代理下载订阅</span><span class="form-hint">只接受 http / socks5 地址。</span></span><span class="toggle"><input type="checkbox" id="egressSourceUseProxy" aria-label="经代理下载订阅"><span class="toggle-slider"></span></span></label>
        <input class="form-input secret-field" id="egressSourceProxy" autocomplete="off" spellcheck="false" placeholder="http://host:port" hidden>
        <div class="egress-form-grid">
          <div><label class="form-label" for="egressSourceInterval">同步间隔（秒）</label><input class="form-input" id="egressSourceInterval" type="number" min="60" max="86400" step="1" value="900"></div>
          <div><label class="form-label" for="egressSourceCapacity">节点默认容量</label><input class="form-input" id="egressSourceCapacity" type="number" min="0" max="100000" step="1" placeholder="不限"></div>
        </div>
        <p class="warning-text" id="egressSourceError" role="alert"></p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" data-egress-close="egressSourceModal">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>
{{end}}
