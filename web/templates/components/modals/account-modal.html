<!-- Account Modal -->
<div class="modal" id="accountModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">添加账号</h3>
      <button class="modal-close" type="button" onclick="closeModal()" aria-label="关闭账号窗口">&times;</button>
    </div>
    <form id="accountForm" onsubmit="saveAccount(event)">
      <input type="hidden" id="accountId" />
      <div class="form-group">
        <label class="form-label">账号类型</label>
        <input type="hidden" id="accountType" value="" />
        <input class="form-input" id="accountTypeDisplay" value="加载渠道…" readonly />
      </div>
      {{range .LoginProviders}}
      <div class="form-group" id="{{.GroupID}}" data-login-group="{{.Key}}" hidden>
        <label class="form-label">{{.Label}}</label>
        <button class="btn btn-secondary" id="{{.ButtonID}}" type="button" data-login-provider="{{.Key}}">{{.ButtonText}}</button>
        <small class="helper-text">{{.HelpText}}</small>
        <div class="account-import-status" id="{{.StatusID}}" hidden></div>
        <div class="account-import-status" id="{{.LinkID}}" hidden>
          <a id="{{.LinkTextID}}" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>
      {{end}}
      <div class="form-group">
        <label class="form-label">
          <label class="toggle">
            <input type="checkbox" id="enabled" checked />
            <span class="toggle-slider"></span>
          </label>
          &nbsp;&nbsp;启用账号
        </label>
      </div>
      <button type="submit" class="btn btn-primary modal-submit">
        保存
      </button>
    </form>
  </div>
</div>
