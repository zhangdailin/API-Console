<div class="mobile-topbar">
  <button class="mobile-menu-btn" type="button" data-sidebar-toggle aria-label="打开或关闭导航菜单" aria-controls="sidebar" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="mobile-topbar-brand">
    <div class="logo">O</div>
    <div class="sidebar-brand-text">
      <div class="title">API Console</div>
      <div class="sidebar-subtitle">管理控制台</div>
    </div>
  </div>
  <button class="btn-icon mobile-theme-toggle" type="button" data-theme-toggle aria-label="切换主题">◐</button>
</div>
<div class="sidebar-overlay" data-sidebar-close aria-hidden="true"></div>
<aside class="sidebar" id="sidebar" aria-label="主导航">
  <div class="sidebar-header">
    <div class="logo">O</div>
    <div class="sidebar-brand-text">
      <div class="title">API Console</div>
      <div class="sidebar-subtitle">管理控制台</div>
    </div>
  </div>
  <ul class="sidebar-menu">
    <li class="sidebar-item">
      <a href="{{.AdminPath}}/?tab=ops" class="sidebar-link {{if eq .ActiveTab "ops"}}active{{end}}" {{if eq .ActiveTab "ops"}}aria-current="page"{{end}}>
        <span class="nav-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 4-6"/><circle cx="7" cy="15" r="1"/><circle cx="17" cy="8" r="1"/></svg>
        </span>
        <span>运维总览</span>
      </a>
    </li>
    <li class="sidebar-item">
      <a href="{{.AdminPath}}/?tab=logs" class="sidebar-link {{if eq .ActiveTab "logs"}}active{{end}}" {{if eq .ActiveTab "logs"}}aria-current="page"{{end}}>
        <span class="nav-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
        </span>
        <span>日志中心</span>
      </a>
    </li>
    <li class="sidebar-item">
      <a href="{{.AdminPath}}/?tab=accounts" class="sidebar-link {{if eq .ActiveTab "accounts"}}active{{end}}" {{if eq .ActiveTab "accounts"}}aria-current="page"{{end}}>
        <span class="nav-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <span>账号管理</span>
      </a>
    </li>
    <li class="sidebar-item">
      <a href="{{.AdminPath}}/?tab=keys" class="sidebar-link {{if eq .ActiveTab "keys"}}active{{end}}" {{if eq .ActiveTab "keys"}}aria-current="page"{{end}}>
        <span class="nav-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.72l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
        <span>配置管理</span>
      </a>
    </li>
    <li class="sidebar-item">
      <a href="{{.AdminPath}}/?tab=models" class="sidebar-link {{if eq .ActiveTab "models"}}active{{end}}" {{if eq .ActiveTab "models"}}aria-current="page"{{end}}>
        <span class="nav-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6"/></svg>
        </span>
        <span>模型管理</span>
      </a>
    </li>
    <li class="sidebar-item">
      <a href="{{.AdminPath}}/?tab=alerts" class="sidebar-link {{if eq .ActiveTab "alerts"}}active{{end}}" {{if eq .ActiveTab "alerts"}}aria-current="page"{{end}}>
        <span class="nav-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </span>
        <span>告警配置</span>
      </a>
    </li>

  </ul>
  <div class="sidebar-footer">
    <div class="sidebar-tools">
      <button class="btn btn-outline" type="button" data-theme-toggle>
        <span class="sidebar-tool-icon" aria-hidden="true">◐</span><span class="sidebar-tool-label" data-theme-label>深色模式</span>
      </button>
      <button class="btn btn-outline" type="button" data-sidebar-collapse aria-controls="sidebar" aria-expanded="true" aria-label="收起侧栏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <!-- The three counters are filled by common.js refreshSidebarAccountStats from
         /api/accounts, which is the one place that knows credential, status and
         quota state. Rendering a server-side number here made the same sidebar
         read differently per tab (账号管理 vs 运维总览); "—" is the honest
         pre-fetch value instead of a second, disagreeing rule. -->
    <div class="sidebar-footer-stats">
      <div class="footer-stat-item">
        <span class="footer-stat-label">总账号</span>
        <span class="footer-stat-value" id="footerTotal">—</span>
      </div>
      <div class="footer-stat-item">
        <span class="footer-stat-label">正常</span>
        <span class="footer-stat-value normal" id="footerNormal">—</span>
      </div>
      <div class="footer-stat-item">
        <span class="footer-stat-label">异常</span>
        <span class="footer-stat-value abnormal" id="footerAbnormal">—</span>
      </div>
    </div>
    <button class="btn btn-outline system-version-button" type="button" data-system-open title="版本与升级"><span aria-hidden="true">↻</span><span id="versionBadge">版本</span></button>
    <button class="btn btn-outline sidebar-logout" type="button" data-logout>
      <span class="nav-glyph nav-glyph-small">EX</span>
      <span>退出登录</span>
    </button>
  </div>
</aside>

{{template "system-modal.html" .}}
