{{define "page-logs"}}
{{template "doc-head.html" .}}
  {{template "page-styles.html" .}}
  <link rel="stylesheet" href="{{.AdminPath}}/css/ops.css?v={{.AssetVersion}}">
</head>

<body>
  {{template "sidebar.html" .}}


  <main class="main-content ops-page">
    <section class="header-section">
      <div>
        <h1>日志中心</h1>
        <p class="page-sub" id="logsTabNote">请求、操作、系统三本账共用一份审计流；某个请求的诊断包挂在该请求的详情里。</p>
      </div>
      <div class="page-actions">
        <button class="btn" id="logsDiagnosticsToggle" type="button" aria-pressed="false" disabled>诊断采集：读取中…</button>
        <button class="btn" id="logsFiltersToggle" type="button" aria-expanded="false" aria-controls="logsFilters">筛选</button>
        <button class="btn" id="logsReload" type="button">刷新</button>
      </div>
    </section>

    <div class="logs-tabs" role="tablist" aria-label="日志类型">
      <button class="logs-tab is-active" role="tab" aria-selected="true" data-kind="request" type="button">请求日志</button>
      <button class="logs-tab" role="tab" aria-selected="false" data-kind="operation" type="button">操作日志</button>
      <button class="logs-tab" role="tab" aria-selected="false" data-kind="system" type="button">系统日志</button>
    </div>


    <div class="logs-scope" id="logsScope" hidden>
      <div class="logs-scope-items" id="logsScopeItems"></div>
      <div class="logs-scope-actions">
        <button class="btn btn-sm" id="logsScopeClear" type="button">清除筛选</button>
        <button class="btn btn-sm" id="logsScopeBack" type="button" hidden>返回运维总览</button>
      </div>
    </div>

    <form class="logs-filters" id="logsFilters" hidden autocomplete="off">
      <label class="ops-select"><span>渠道</span><input id="filterChannel" placeholder="grok" /></label>
      <label class="ops-select"><span>模型</span><input id="filterModel" placeholder="grok-4.6" /></label>
      <label class="ops-select"><span>状态</span><input id="filterStatus" placeholder="success" /></label>
      <label class="ops-select"><span>结果</span>
        <select id="filterOutcome" class="compact-select">
          <option value="">全部结果</option>
          <option value="failed">失败（全部失败类型）</option>
          <option value="success">成功</option>
          <option value="rate_limited">限流 429/529</option>
          <option value="upstream_auth">上游认证失败 401/403</option>
          <option value="rejected">网关拒绝 401/403（我方拒绝）</option>
          <option value="quota_exhausted">额度用尽 402</option>
          <option value="client_error">客户端错误 4xx</option>
          <option value="server_error">上游错误 5xx</option>
          <option value="stream_error">流中断</option>
        </select>
      </label>
      <label class="ops-select"><span>起始</span><input id="filterSince" placeholder="2026-09-13T00:00:00Z" /></label>
      <label class="ops-select"><span>结束</span><input id="filterUntil" placeholder="2026-09-13T01:00:00Z" /></label>
      <label class="ops-select"><span>操作者</span><input id="filterActor" placeholder="admin-session" /></label>
      <label class="ops-select"><span>动作</span><input id="filterAction" placeholder="accounts.update" /></label>
      <div class="logs-filter-actions">
        <button class="ops-chip" id="logsClear" type="button">清除</button>
        <button class="btn-primary" type="submit">筛选</button>
      </div>
      <p class="logs-filter-note" id="logsFilterScope">—</p>
    </form>

    <div class="logs-table-wrap" id="logsTableWrap">
      <table class="ops-table logs-table is-request" id="logsTable">
        <thead>
          <tr id="logsHeadRow">
            <th>时间</th>
            <th>渠道 / 模型</th>
            <th>端点</th>
            <th>状态</th>
            <th>Token</th>
            <th>费用</th>
            <th>延迟</th>
            <th>IP</th>
          </tr>
        </thead>
        <tbody id="logsRows">
          <tr><td colspan="8" class="table-empty-cell">正在加载…</td></tr>
        </tbody>
      </table>
    </div>
    <nav class="pagination-shell logs-pager" id="logsPager" aria-label="日志分页" hidden>
      <span class="pagination-info" id="logsPageInfo">第 1 页</span>
      <div class="pagination-controls">
        <label class="logs-page-size"><span>每页</span>
          <select id="logsPageSize" class="compact-select" aria-label="每页条数">
            <option value="20">20 条</option>
            <option value="50" selected>50 条</option>
            <option value="100">100 条</option>
          </select>
        </label>
        <button class="btn btn-page btn-outline" id="logsFirst" type="button">首页</button>
        <button class="btn btn-page btn-outline" id="logsPrev" type="button">上一页</button>
        <span class="btn btn-page btn-primary" id="logsPageNo" aria-current="page">1</span>
        <button class="btn btn-page btn-outline" id="logsNext" type="button">下一页</button>
      </div>
    </nav>

    <p class="ops-coverage logs-coverage" id="logsCoverage">—</p>

    <aside class="drawer" id="logsDetail" aria-live="polite" aria-label="日志详情" aria-hidden="true">
      <div class="drawer-head">
        <div>
          <div class="logs-detail-section-title" id="logsDetailTitle">详情</div>
          <p class="muted" id="logsDetailSub">选择左侧一条记录查看详情</p>
        </div>
        <button class="panel-close-btn" id="logsDetailClose" type="button" aria-label="关闭详情">✕</button>
      </div>
      <div class="drawer-body" id="logsDetailBody"></div>
    </aside>
    <div class="drawer-backdrop" id="logsDetailBackdrop"></div>

    {{template "page-scripts.html" .}}
    <script src="{{.AdminPath}}/js/logs.js?v={{.AssetVersion}}"></script>
  </main>
</body>

</html>

{{end}}
