{{define "page-alerts"}}
{{template "doc-head.html" .}}
  {{template "page-styles.html" .}}
  <link rel="stylesheet" href="{{.AdminPath}}/css/ops.css?v={{.AssetVersion}}">
</head>

<body>
  {{template "sidebar.html" .}}


  <main class="main-content ops-page">
    <section class="header-section">
      <div>
        <h1>告警配置</h1>
        <p class="page-sub">这里的阈值就是运维总览“告警事件”的判定依据：同一份规则、同一个引擎，改完立即生效并持久化。</p>
      </div>
      <div class="page-actions">
        <button class="btn" id="alertsReload" type="button">重新读取</button>
        <button class="btn" id="alertsResetDefaults" type="button">恢复默认</button>
        <button class="btn-primary" id="alertsSave" type="button">保存规则</button>
      </div>
    </section>

    <section class="ops-card">
      <div class="ops-card-head">
        <h2>当前规则</h2>
        <span class="ops-hint" id="alertsState">—</span>
      </div>
      <form class="alerts-form" id="alertsForm" autocomplete="off">
        <div class="alerts-grid" id="alertsFields"></div>
        <p class="logs-filter-note" id="alertsNote"></p>
        <div class="alerts-preview" id="alertsPreview"></div>
      </form>
    </section>

    <section class="ops-card">
      <div class="ops-card-head">
        <div>
          <h2>规则触发记录</h2>
        </div>
        <div class="ops-card-tools">
          <button class="btn btn-sm" id="alertsEventsReload" type="button">刷新</button>
        </div>
      </div>
      <div class="ops-table-wrap">
        <table class="ops-table" id="alertsEvents">
          <thead>
            <tr>
              <th>时间</th>
              <th>状态</th>
              <th>级别</th>
              <th>渠道</th>
              <th>说明</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    {{template "page-scripts.html" .}}
    <script src="{{.AdminPath}}/js/alerts.js?v={{.AssetVersion}}"></script>
  </main>
</body>

</html>

{{end}}
