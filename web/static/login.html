<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理登录 - API Console</title>
    <script src="js/theme.js?v=__ASSET_VERSION__"></script>
    <!-- Use the refined main.css -->
    <link rel="stylesheet" href="css/main.css?v=__ASSET_VERSION__">
</head>
<body class="login-body">
    <button class="btn login-theme-toggle" type="button" data-theme-toggle><span aria-hidden="true">◐</span><span data-theme-label>深色模式</span></button>
    <div class="login-card">
        <div class="login-brand">
            <div class="logo">O</div>
            <div>
                <div class="title">API Console</div>
                <div class="login-brand-subtitle">Secure admin access</div>
            </div>
        </div>

        <div class="login-hero">
            <div class="login-kicker">Admin access</div>
            <h1>管理员登录</h1>
            <p>统一管理渠道账号、模型配置和运行状态。</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                    <input type="text" id="username" class="form-input" placeholder="请输入用户名" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">管理员密码</label>
                <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                    <input type="password" id="password" class="form-input" placeholder="请输入密码" required autocomplete="current-password">
                    <button type="button" class="btn-icon password-toggle" id="passwordToggle" aria-label="显示密码" aria-pressed="false"></button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary login-submit" id="loginBtn">
                <div class="loading-spinner" id="spinner" style="display: none;"></div>
                <span>登录</span>
            </button>
        </form>

        <div class="login-links">
            <a href="https://github.com/zhangdailin/Orchids-2api" target="_blank">GitHub</a>
            <span aria-hidden="true">·</span>
            <a href="https://github.com/zhangdailin/Orchids-2api#文档" target="_blank">文档教程</a>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast login-toast" data-type="error" role="alert">
        <span class="toast-mark" aria-hidden="true">!</span>
        <span id="toastMessage">登录失败，请检查账号密码</span>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const spinner = document.getElementById('spinner');
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        const eyeOpen = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
        const eyeOff = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.2 3.2"/><path d="M6.6 6.6A17.4 17.4 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg>';
        function renderPasswordToggle() {
            const visible = passwordInput.getAttribute('type') === 'text';
            passwordToggle.innerHTML = visible ? eyeOff : eyeOpen;
            passwordToggle.setAttribute('aria-pressed', String(visible));
            passwordToggle.setAttribute('aria-label', visible ? '隐藏密码' : '显示密码');
        }
        renderPasswordToggle();
        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            renderPasswordToggle();
        });

        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = passwordInput.value;

            // UI loading state
            loginBtn.disabled = true;
            spinner.style.display = 'block';
            loginBtn.querySelector('span').textContent = '正在登录...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    window.location.href = './';
                } else {
                    const error = await response.text();
                    showToast(error || '登录失败，请重试');
                }
            } catch (err) {
                showToast('网络连接失败');
            } finally {
                loginBtn.disabled = false;
                spinner.style.display = 'none';
                loginBtn.querySelector('span').textContent = '登录';
            }
        });
    </script>
</body>
</html>
